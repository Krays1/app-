<!DOCTYPE html>
<html>
<head>
    <title>Zell0 Desktop - Simple</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }

        .status {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 10px;
        }

        .status.connected { background: #4CAF50; }
        .status.disconnected { background: #f44336; }

        .main-content {
            display: flex;
            flex: 1;
            gap: 20px;
        }

        .sidebar {
            width: 250px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .chat-area {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(10px);
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 20px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }

        .message {
            display: flex;
            margin-bottom: 15px;
            align-items: flex-start;
        }

        .message.sent {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #4CAF50;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin: 0 10px;
        }

        .message-content {
            max-width: 70%;
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 12px;
            opacity: 0.8;
        }

        .message-text {
            background: #2196F3;
            padding: 10px 15px;
            border-radius: 15px;
            word-wrap: break-word;
        }

        .message.sent .message-text {
            background: #4CAF50;
        }

        .message.received .message-text {
            background: #2196F3;
        }

        .input-area {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.1);
            color: #e0e0e0;
            font-size: 14px;
        }

        input[type="text"]::placeholder {
            color: rgba(224, 224, 224, 0.6);
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            background: #4CAF50;
            color: white;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        button:hover {
            background: #45a049;
        }

        button:disabled {
            background: #666;
            cursor: not-allowed;
        }

        .audio-controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .record-button {
            background: #f44336;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .record-button.recording {
            background: #ff9800;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .play-button {
            background: #2196F3;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .voice-message {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .connection-form {
            text-align: center;
            margin-bottom: 20px;
        }

        .user-list {
            margin-top: 20px;
        }

        .user-item {
            padding: 10px;
            margin: 5px 0;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            display: flex;
            align-items: center;
        }

        .user-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #4CAF50;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Zell0 Desktop - Simple</h1>
        <div id="status">
            <span class="status disconnected"></span>
            <span id="status-text">Disconnected</span>
        </div>
    </div>

    <div class="main-content">
        <div class="sidebar">
            <div class="connection-form" id="connection-form">
                <input type="text" id="username-input" placeholder="Enter username" maxlength="20">
                <button onclick="connect()">Connect</button>
            </div>
            
            <div class="user-list">
                <h3>Connected Users</h3>
                <div id="users-container">
                    <p>No users connected</p>
                </div>
            </div>
        </div>

        <div class="chat-area">
            <h3>Chat Room</h3>
            <div class="messages" id="messages-container">
                <p>No messages yet</p>
            </div>
            
            <div class="input-area">
                <input type="text" id="message-input" placeholder="Type your message..." maxlength="500">
                <button onclick="sendMessage()">Send</button>
            </div>
            
            <div class="audio-controls">
                <button class="record-button" id="record-button" onclick="toggleRecording()" disabled>
                    🎤
                </button>
                <button class="push-to-talk-button" id="push-to-talk-button" onclick="togglePushToTalk()" disabled>
                    🎙️
                </button>
                <span id="recording-status">Hold to record voice message</span>
            </div>
        </div>
    </div>

    <script src="simple-renderer.js"></script>
</body>
</html>
